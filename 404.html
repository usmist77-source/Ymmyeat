<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yummy Eat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#160826;--primary:#ec26a6;--secondary:#ffcc33;--surface:#261040;--surface2:#341656;--text:#fcf4ff;--muted:#c4b0de;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}body{min-height:100vh}.app{min-height:100vh;background:radial-gradient(60rem 30rem at 110% -10%,rgba(236,38,166,.16),transparent 60%),radial-gradient(40rem 26rem at -10% 40%,rgba(124,58,237,.14),transparent 60%)}
.nav{position:sticky;top:0;z-index:50;background:rgba(22,8,38,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,calc((100vw - 1200px)/2));gap:12px}.brand{font-family:Bungee,sans-serif;color:#ff3ec8;text-shadow:0 0 12px #ec26a6;font-size:24px;line-height:.8}.brand span{display:block;color:var(--secondary);font-size:15px;margin-top:5px}.nav-actions{display:flex;gap:8px}.iconbtn{border:1px solid rgba(255,255,255,.13);background:var(--surface);color:white;border-radius:14px;min-width:44px;height:44px}.iconbtn:hover{border-color:var(--primary)}
.hero{position:relative;overflow:hidden;min-height:420px;background:linear-gradient(90deg,rgba(20,4,36,.9),rgba(20,4,36,.45)),url('https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1800&q=85') center/cover}.hero-inner{max-width:1200px;margin:auto;padding:80px 18px}.pill{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);font-size:12px;font-weight:800}.hero h1{font-family:Bungee,sans-serif;font-size:clamp(50px,9vw,100px);line-height:.9;margin:22px 0 10px;direction:ltr}.hero h1 span:first-child{color:#ff3ec8;text-shadow:0 0 12px #ff3ec8,0 0 55px #ec26a6}.hero h1 span:last-child{color:#ffcc33;text-shadow:0 0 12px rgba(255,204,51,.7)}.hero h2{font-family:Lalezar,sans-serif;font-size:30px;margin:10px 0}.hero p{max-width:560px;color:#fffC;line-height:1.7}.primary{background:var(--primary);color:white;border:0;border-radius:15px;padding:13px 22px;font-weight:800;box-shadow:0 0 30px rgba(236,38,166,.35)}
.wrap{max-width:1200px;margin:auto;padding:0 18px}.cats{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;margin-top:-25px;position:relative;z-index:5}.cat{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:14px 5px;font-weight:800}.cat.active{background:var(--primary);border-color:transparent;box-shadow:0 0 22px rgba(236,38,166,.35)}.cat small{display:block;opacity:.7;margin-top:4px;font-weight:500}
.content{padding:32px 0 80px}.tools{position:sticky;top:69px;z-index:20;padding:12px 0;background:linear-gradient(var(--bg) 72%,transparent);}.search{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none}.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(236,38,166,.15)}.chips{display:flex;gap:8px;overflow:auto;padding:9px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:9px 14px}.chip.active{background:var(--primary);color:white;border-color:transparent}.section{margin-top:25px}.section-title{display:flex;align-items:center;gap:10px}.section-title h2{font-family:Lalezar,sans-serif;font-size:30px;margin:0}.line{height:1px;background:linear-gradient(90deg,rgba(236,38,166,.5),transparent);flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px -14px #000}.photo{aspect-ratio:4/3;background:linear-gradient(135deg,#5512a1,#ec26a6);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}.card:hover .photo img{transform:scale(1.05)}.cardbody{padding:14px}.name{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{color:var(--secondary);font-weight:800;font-size:18px;text-shadow:0 0 8px rgba(255,204,51,.35)}.cardrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.add{width:44px;height:44px;border:0;border-radius:14px;background:var(--primary);color:white;font-size:24px;box-shadow:0 0 16px rgba(236,38,166,.35)}
.visit{margin-top:45px;border:1px solid var(--line);border-radius:28px;overflow:hidden;min-height:220px;background:linear-gradient(90deg,rgba(20,4,36,.93),rgba(20,4,36,.5)),url('https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1600&q=85') center/cover;padding:45px}.visit h2{font-family:Lalezar,sans-serif;font-size:38px;margin:8px 0}.muted{color:var(--muted)}
.cartbar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:60;width:min(92%,520px);display:flex;justify-content:space-between;align-items:center;background:var(--primary);border:0;color:white;border-radius:17px;padding:14px 18px;font-weight:800;box-shadow:0 8px 40px rgba(236,38,166,.5)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:none}.overlay.open{display:block}.drawer{position:absolute;inset-block:0;inset-inline-end:0;width:min(100%,430px);background:var(--bg);overflow:auto;padding:20px}.drawer h2{font-family:Lalezar,sans-serif;font-size:30px;margin-top:0}.close{float:left;border:1px solid var(--line);background:var(--surface);color:white;border-radius:12px;width:42px;height:42px}.cartitem{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:white}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:18px 0}.form label{display:block;font-weight:800;margin-top:12px}.form input,.form textarea{width:100%;margin-top:6px;background:var(--surface2);border:1px solid var(--line);color:white;border-radius:13px;padding:12px;outline:none}.form textarea{min-height:80px;resize:vertical}.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.light{--bg:#f8f4ff;--surface:#fff;--surface2:#f0e8fc;--text:#200c36;--muted:#705c8c;--line:rgba(60,20,100,.12)}
@media(max-width:900px){.cats{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.hero{min-height:390px}.hero-inner{padding:65px 18px}.cats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.cardbody{padding:11px}.name{font-size:15px}.visit{padding:28px}.tools{top:68px}.nav{padding-inline:12px}.brand{font-size:20px}.brand span{font-size:13px}}
</style></head>
<body><div id="app"></div>
<script>
const CATS=[['pizzas','بيتزا','Pizzas'],['sandwiches','ساندويتشات','Sandwiches'],['burgers','برغر','Burgers'],['plats','أطباق','Plats'],['tacos','تاكوس','Tacos'],['poutine','بوتين','Poutine'],['kids','وجبات الأطفال','Kids'],['supplements','إضافات','Suppléments'],['boissons','مشروبات','Boissons']];
const IMG={pizza:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=600&q=80',burger:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80',sandwich:'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=600&q=80',tacos:'https://images.unsplash.com/photo-1552332386-f8dd00dc2f85?auto=format&fit=crop&w=600&q=80',plate:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=80',fries:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80',drink:'https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=600&q=80'};
const P=[
['pz1','pizzas','Margherita','مارغريتا',700,'pizza'],['pz2','pizzas','Chicken','دجاج',850,'pizza'],['pz3','pizzas','Viande','لحم',950,'pizza'],['pz4','pizzas','Végétarienne','خضر',800,'pizza'],['pz5','pizzas','Thon','تونة',900,'pizza'],
['s1','sandwiches','Suprême','سوبريم',650,'sandwich'],['s2','sandwiches','Classic Beef','كلاسيك لحم',600,'sandwich'],['s3','sandwiches','Marinato','ماريناتو',650,'sandwich'],['s4','sandwiches','Le Crunch','لو كرونش',700,'sandwich'],
['b1','burgers','Burger Classique','برغر كلاسيك',650,'burger'],['b2','burgers','Le Crousti','لو كروستي',750,'burger'],['b3','burgers','Giga Burger','غيغا برغر',900,'burger'],['b4','burgers','Yummy Burger','يومي برغر',850,'burger'],
['pl1','plats','Poulet','دجاج',1100,'plate'],['pl2','plats','Escalope','إسكالوب',1200,'plate'],['pl3','plats','Mixte','ميكس',1350,'plate'],
['t1','tacos','Tacos Poulet','تاكوس دجاج',750,'tacos'],['t2','tacos','Tacos Viande','تاكوس لحم',850,'tacos'],['t3','tacos','Tacos Mixte','تاكوس ميكس',950,'tacos'],
['pt1','poutine','Poutine Classique','بوتين كلاسيك',650,'fries'],['pt2','poutine','Poutine Poulet','بوتين دجاج',800,'fries'],['pt3','poutine','Poutine Viande','بوتين لحم',900,'fries'],
['k1','kids','Kids Burger','وجبة أطفال برغر',650,'burger'],['k2','kids','Kids Nuggets','وجبة أطفال ناغتس',650,'plate'],
['x1','supplements','Frites','بطاطا مقلية',250,'fries'],['x2','supplements','Fromage','جبن',150,'plate'],['x3','supplements','Sauce','صوص',100,'plate'],
['d1','boissons','Canette','علبة مشروب',150,'drink'],['d2','boissons','Soda 1L','مشروب غازي 1 لتر',250,'drink'],['d3','boissons','Jus','عصير',250,'drink'],['d4','boissons','Eau','ماء',50,'drink']].map(x=>({id:x[0],cat:x[1],fr:x[2],ar:x[3],price:x[4],img:IMG[x[5]]}));
let lang=localStorage.ye_lang||'ar', light=localStorage.ye_light==='1', cart=JSON.parse(localStorage.ye_cart||'[]'), active='all',q='';
const T={ar:{tag:'أكل سريع جزائري • نيون ونكهات',title:'الطعم اللي يلمع.',sub:'بيتزا، برغر، تاكوس والمزيد — اطلب في ثوانٍ ويوصلك لباب الدار.',order:'اطلب الآن',search:'ابحث عن طبق…',cart:'السلة',empty:'سلتك فارغة',total:'المجموع',checkout:'إتمام الطلب',name:'الاسم الكامل',phone:'رقم الهاتف',city:'الولاية / البلدية',address:'عنوان التوصيل',notes:'ملاحظات (اختياري)',send:'اطلب عبر واتساب',visit:'زورونا',visitSub:'أجواء نيون، خدمة سريعة، ونكهات سخية.',required:'حقل مطلوب',phoneBad:'رقم جزائري غير صالح',back:'رجوع'},fr:{tag:'Fast-food algérien • Néon & saveurs',title:'Le goût qui brille.',sub:'Pizzas, burgers, tacos et plus — commandez en quelques secondes.',order:'Commander',search:'Rechercher un plat…',cart:'Panier',empty:'Votre panier est vide',total:'Total',checkout:'Finaliser la commande',name:'Nom complet',phone:'Téléphone',city:'Wilaya / Commune',address:'Adresse de livraison',notes:'Remarques (optionnel)',send:'Commander via WhatsApp',visit:'Venez nous voir',visitSub:'Ambiance néon, service rapide, saveurs généreuses.',required:'Champ obligatoire',phoneBad:'Numéro algérien invalide',back:'Retour'}};
function tr(k){return T[lang][k]||k} function money(n){return new Intl.NumberFormat('fr-FR').format(n)+' '+(lang==='ar'?'دج':'DA')}
function save(){localStorage.ye_lang=lang;localStorage.ye_light=light?'1':'0';localStorage.ye_cart=JSON.stringify(cart)}
function render(){document.documentElement.classList.toggle('light',light);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';const root=document.getElementById('app');let items=P.filter(p=>(active==='all'||p.cat===active)&&(!q||`${p.fr} ${p.ar}`.toLowerCase().includes(q.toLowerCase())));let groups=CATS.map(c=>({...Object.fromEntries([['id',c[0]],['ar',c[1]],['fr',c[2]]]),items:items.filter(p=>p.cat===c[0])})).filter(g=>g.items.length);root.innerHTML=`<div class="app"><nav class="nav"><div class="brand">YUMMY<span>EAT</span></div><div class="nav-actions"><button class="iconbtn" onclick="toggleLang()">${lang==='ar'?'FR':'ع'}</button><button class="iconbtn" onclick="toggleTheme()">${light?'🌙':'☀️'}</button><button class="iconbtn" onclick="openCart()">🛍️ ${cart.reduce((s,x)=>s+x.qty,0)||''}</button></div></nav><section class="hero"><div class="hero-inner"><span class="pill">🟢 ${tr('tag')}</span><h1><span>YUMMY</span><span>EAT</span></h1><h2>${tr('title')}</h2><p>${tr('sub')}</p><button class="primary" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">${tr('order')} ↓</button></div></section><div class="wrap"><div class="cats">${CATS.map(c=>`<button class="cat ${active===c[0]?'active':''}" onclick="setCat('${c[0]}')">${lang==='ar'?c[1]:c[2]}<small>${P.filter(p=>p.cat===c[0]).length}</small></button>`).join('')}</div><main id="menu" class="content"><div class="tools"><input class="search" value="${q.replaceAll('"','&quot;')}" oninput="setSearch(this.value)" placeholder="${tr('search')}"><div class="chips"><button class="chip ${active==='all'?'active':''}" onclick="setCat('all')">${lang==='ar'?'الكل':'Tout'}</button>${CATS.map(c=>`<button class="chip ${active===c[0]?'active':''}" onclick="setCat('${c[0]}')">${lang==='ar'?c[1]:c[2]}</button>`).join('')}</div></div>${groups.map(g=>`<section class="section"><div class="section-title"><h2>${lang==='ar'?g.ar:g.fr}</h2><div class="line"></div></div><div class="grid">${g.items.map(card).join('')}</div></section>`).join('')}<section class="visit"><h2>${tr('visit')}</h2><p>${tr('visitSub')}</p></section><footer class="muted" style="text-align:center;padding:25px">© Yummy Eat</footer></main></div>${cart.length?`<button class="cartbar" onclick="openCart()"><span>🛍️ ${cart.reduce((s,x)=>s+x.qty,0)} ${tr('cart')}</span><span>${money(cart.reduce((s,x)=>s+x.price*x.qty,0))}</span></button>`:''}</div><div id="overlay" class="overlay"></div>`}
function card(p){return `<article class="card"><div class="photo"><img src="${p.img}" loading="lazy" onerror="this.style.display='none'"></div><div class="cardbody"><div class="name">${lang==='ar'?p.ar:p.fr}</div><div class="sub">${lang==='ar'?p.fr:p.ar}</div><div class="cardrow"><span class="price">${money(p.price)}</span><button class="add" onclick="add('${p.id}')">+</button></div></div></article>`}
function setCat(c){active=c;render()} function setSearch(v){q=v;render()} function toggleLang(){lang=lang==='ar'?'fr':'ar';save();render()} function toggleTheme(){light=!light;save();render()} function add(id){const p=P.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id:p.id,fr:p.fr,ar:p.ar,price:p.price,qty:1});save();render();}
function openCart(){renderCart()};function closeCart(){document.getElementById('overlay')?.remove();render()}
function renderCart(){const ov=document.getElementById('overlay');if(!ov)return;ov.className='overlay open';ov.innerHTML=`<aside class="drawer"><button class="close" onclick="closeCart()">×</button><h2>${tr('cart')}</h2>${cart.length?cart.map(x=>`<div class="cartitem"><div><b>${lang==='ar'?x.ar:x.fr}</b><div class="muted">${money(x.price)} × ${x.qty}</div></div><div class="qty"><button onclick="qty('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="qty('${x.id}',1)">+</button></div></div>`).join('')+`<div class="total"><span>${tr('total')}</span><span>${money(cart.reduce((s,x)=>s+x.price*x.qty,0))}</span></div><button class="primary" style="width:100%" onclick="checkout()">${tr('checkout')}</button>`:`<div class="empty">${tr('empty')}</div>`}</aside>`;ov.onclick=e=>{if(e.target===ov)closeCart()}}
function qty(id,d){const x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);save();renderCart();render()}
function checkout(){if(!cart.length)return;const ov=document.getElementById('overlay');ov.innerHTML=`<aside class="drawer"><button class="close" onclick="closeCart()">×</button><h2>${tr('checkout')}</h2><form class="form" onsubmit="submitOrder(event)"><label>${tr('name')}<input name="name" required></label><label>${tr('phone')}<input name="phone" inputmode="tel" placeholder="0550 12 34 56" required></label><label>${tr('city')}<input name="city" required></label><label>${tr('address')}<textarea name="address" required></textarea></label><label>${tr('notes')}<textarea name="notes"></textarea></label><button class="primary" style="width:100%;margin-top:18px">${tr('send')} · ${money(cart.reduce((s,x)=>s+x.price*x.qty,0))}</button></form></aside>`}
function submitOrder(e){e.preventDefault();const f=new FormData(e.target),phone=String(f.get('phone')).replace(/[\s.-]/g,'');if(!/^(?:0|\+213|00213)[5-7]\d{8}$/.test(phone)){alert(tr('phoneBad'));return}const orderNo='YE-'+Date.now().toString().slice(-5),items=cart.map(x=>`- ${x.qty} × ${lang==='ar'?x.ar:x.fr} = ${money(x.price*x.qty)}`),total=cart.reduce((s,x)=>s+x.price*x.qty,0);const text=(lang==='ar'?`*طلب جديد - Yummy Eat*\nرقم الطلب: ${orderNo}\nالاسم: ${f.get('name')}\nالهاتف: ${phone}\nالولاية / البلدية: ${f.get('city')}\nالعنوان: ${f.get('address')}\n${f.get('notes')?'ملاحظات: '+f.get('notes')+'\n':''}\n*الطلبات:*\n${items.join('\n')}\n\n*المجموع: ${money(total)}*\nالدفع عند الاستلام (نقداً)`: `*Nouvelle commande - Yummy Eat*\nN° commande: ${orderNo}\nNom: ${f.get('name')}\nTéléphone: ${phone}\nWilaya / Commune: ${f.get('city')}\nAdresse: ${f.get('address')}\n${f.get('notes')?'Remarques: '+f.get('notes')+'\n':''}\n*Commande:*\n${items.join('\n')}\n\n*Total: ${money(total)}*\nPaiement à la livraison (espèces)`);localStorage.yummyeat_last_order=JSON.stringify({orderNo,createdAt:new Date().toISOString(),name:f.get('name'),phone});const SHOP_WHATSAPP='213000000000';window.open('https://wa.me/'+SHOP_WHATSAPP+'?text='+encodeURIComponent(text),'_blank','noopener,noreferrer');cart=[];save();closeCart()}
render();
</script></body></html>
